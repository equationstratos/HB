name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hb
          POSTGRES_PASSWORD: hb
          POSTGRES_DB: hb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hb" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://hb:hb@localhost:5432/hb_test
      REDIS_URL: redis://localhost:6379
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build des paquets partagés
        run: pnpm turbo run build --filter=@hb/shared --filter=@hb/api-client

      - name: Migrations de la base de test
        run: pnpm --filter @hb/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm turbo run build --filter=@hb/api --filter=@hb/admin
